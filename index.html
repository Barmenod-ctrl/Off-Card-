<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Off-Card — Симулятор маршрутов</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'" />
<style>
:root{--bg:#071018;--panel:#0d1822;--panel2:#101f2c;--text:#f5f8fb;--muted:#91a0ad;--blue:#1683ff;--line:#223443;--danger:#ff4d5f;--green:#35d07f}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input,select{font:inherit}button{border:0;color:var(--text);cursor:pointer}.app{height:100%;display:flex;flex-direction:column}
.top{height:68px;padding:10px 14px env(safe-area-inset-top) 14px;display:flex;align-items:center;gap:10px;background:rgba(7,16,24,.94);z-index:1000;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#1683ff,#66b6ff);display:grid;place-items:center;font-size:21px;box-shadow:0 5px 20px #1683ff33}.brand{flex:1}.brand b{display:block;font-size:19px}.brand span{font-size:12px;color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:13px;background:#122331;border:1px solid #243949;font-size:19px}
#map{flex:1;min-height:0}.leaflet-control-attribution{font-size:9px}
.fab{position:absolute;right:14px;top:82px;z-index:900;background:#1683ff;padding:12px 15px;border-radius:16px;font-weight:700;box-shadow:0 8px 25px #0008}.fab.secondary{top:136px;background:#122331;border:1px solid #2b4050}
.bottom{background:rgba(7,16,24,.97);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;z-index:1000}.nav{flex:1;padding:8px 3px;border-radius:12px;background:transparent;color:#8e9ca8;font-size:11px}.nav.active{background:#122536;color:#48a5ff}.nav div{font-size:21px;margin-bottom:2px}
.sheet{position:absolute;left:10px;right:10px;bottom:76px;z-index:950;max-height:55vh;overflow:auto;background:rgba(10,23,33,.97);border:1px solid #294052;border-radius:22px;padding:14px;box-shadow:0 15px 50px #000b;display:none}.sheet.show{display:block}.sheethead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.sheethead h3{margin:0;font-size:18px}.close{margin-left:auto;background:#1a2b38;border-radius:10px;width:34px;height:34px}.row{display:flex;gap:8px;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#10202d;border:1px solid #263c4c;border-radius:16px;padding:12px;margin:8px 0}.machine{display:flex;gap:10px;align-items:center}.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor}.machine .grow{flex:1}.small{font-size:12px;color:var(--muted)}.name{font-weight:700}.btn{background:#172b3a;border:1px solid #2a4354;padding:10px 12px;border-radius:12px}.btn.primary{background:#1683ff}.btn.green{background:#147a4a}.btn.red{background:#8f2734}.btn.full{width:100%}.input{width:100%;background:#0b1720;color:#fff;border:1px solid #2a4150;border-radius:11px;padding:10px}.label{font-size:11px;color:var(--muted);margin:8px 0 4px}.range{width:100%}.pill{padding:5px 8px;border-radius:9px;background:#182d3b;color:#a9bac7;font-size:11px}.progress{height:6px;border-radius:99px;background:#1a2d3a;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;width:0;background:var(--color,#1683ff);border-radius:99px}
.menuTitle{font-size:22px;font-weight:800;margin-bottom:12px}.empty{padding:20px;text-align:center;color:var(--muted)}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:74px;z-index:1200;background:#102331;border:1px solid #355166;padding:10px 14px;border-radius:13px;display:none}.toast.show{display:block}
@media(min-width:700px){.sheet{width:420px;right:auto}.bottom{max-width:700px;margin:auto;width:100%}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="logo">➤</div><div class="brand"><b>Off-Card</b><span>Симулятор маршрутов</span></div><button class="iconbtn" id="settingsBtn">⚙️</button><button class="iconbtn" id="helpBtn">?</button></header>
  <div id="map"></div>
  <button class="fab" id="addMachine">＋ Машинка</button><button class="fab secondary" id="fitAll">⌖ Все</button>
  <div class="toast" id="toast"></div>
  <section class="sheet" id="sheet"></section>
  <nav class="bottom">
    <button class="nav active" data-page="home"><div>⌂</div>Главная</button><button class="nav" data-page="map"><div>▱</div>Карта</button><button class="nav" data-page="machines"><div>🚗</div>Машинки</button><button class="nav" data-page="routes"><div>⌁</div>Маршруты</button><button class="nav" data-page="scenarios"><div>▣</div>Сценарии</button>
  </nav>
</div>
<script>
function loadLeaflet(done){
  if(window.L){done();return;}
  const urls=['https://unpkg.com/leaflet@1.9.4/dist/leaflet.js','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'];
  let i=0;
  function next(){
    if(window.L){done();return;}
    if(i>=urls.length){document.getElementById('map').innerHTML='<div style="padding:30px;text-align:center;color:#91a0ad">Не удалось загрузить карту. Проверь интернет-соединение и обнови страницу.</div>';return;}
    const s=document.createElement('script'); s.src=urls[i++]; s.onload=()=>done(); s.onerror=next; document.head.appendChild(s);
  }
  next();
}
loadLeaflet(()=>{try{initApp()}catch(e){document.getElementById('map').innerHTML='<div style="padding:30px;text-align:center;color:#ff9aa5">Ошибка запуска приложения. Обнови страницу.</div>';console.error(e)}});
function initApp(){
const COLORS=['#1683ff','#ff4056','#35d07f','#ffc53d','#b06cff','#ff8b3d','#00c8c8'];
let machines=[];let savedRoutes=JSON.parse(localStorage.getItem('offcard_routes')||'[]');let scenarios=JSON.parse(localStorage.getItem('offcard_scenarios')||'[]');let selected=null;let drawing=null;let last=performance.now();
const STATE_KEY='offcard_state_v3';
function persistState(){try{localStorage.setItem(STATE_KEY,JSON.stringify(machines.map(m=>({id:m.id,name:m.name,color:m.color,speed:m.speed,route:m.route,travelled:m.travelled}))));}catch(e){}}
function restoreState(){try{const a=JSON.parse(localStorage.getItem(STATE_KEY)||'[]');machines=a.map((x,i)=>({id:x.id||String(Date.now()+i),name:x.name||('Машинка '+(i+1)),color:x.color||COLORS[i%COLORS.length],speed:Number(x.speed)||50,route:Array.isArray(x.route)?x.route:[],travelled:Number(x.travelled)||0,running:false,routeLine:null,progressLine:null,marker:null}));}catch(e){machines=[];}}
const map=L.map('map',{zoomControl:false}).setView([48.45,35.05],7);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function dist(a,b){const R=6371, p=Math.PI/180, dlat=(b.lat-a.lat)*p,dlon=(b.lng-a.lng)*p;const x=Math.sin(dlat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function routeStats(route){let total=0,seg=[];for(let i=1;i<route.length;i++){const d=dist(route[i-1],route[i]);total+=d;seg.push(d)}return {total,seg}}
function posAt(m){if(m.route.length<2)return m.route[0]||map.getCenter();const s=routeStats(m.route),d=Math.max(0,Math.min(m.travelled,s.total));let acc=0;for(let i=0;i<s.seg.length;i++){const len=s.seg[i],a=m.route[i],b=m.route[i+1];if(len===0){if(d===acc)return {lat:a.lat,lng:a.lng};continue}if(d<=acc+len){const t=(d-acc)/len;return {lat:a.lat+(b.lat-a.lat)*t,lng:a.lng+(b.lng-a.lng)*t}}acc+=len}return m.route[m.route.length-1]}
function progressPoints(m){if(!m.route.length)return [];if(m.route.length===1)return [m.route[0]];const d=Math.max(0,m.travelled),s=routeStats(m.route);if(d<=0)return [m.route[0]];let acc=0,out=[m.route[0]];for(let i=1;i<m.route.length;i++){const len=s.seg[i-1];if(len===0)continue;if(d>=acc+len){out.push(m.route[i]);acc+=len;continue}out.push(posAt(m));break}return out}
function icon(color){return L.divIcon({className:'',html:`<div style="width:25px;height:25px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:3px solid #fff;box-shadow:0 2px 12px #000b"><div style="transform:rotate(45deg);font-size:12px;text-align:center;line-height:19px">🚗</div></div>`,iconSize:[25,25],iconAnchor:[12,25]})}
function createMachine(name){const id=crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const m={id,name:name||`Машинка ${machines.length+1}`,color:COLORS[machines.length%COLORS.length],speed:50,route:[],travelled:0,running:false,routeLine:null,progressLine:null,marker:null};machines.push(m);selected=id;refresh();return m}
function removeLayers(m){if(m.routeLine)map.removeLayer(m.routeLine);if(m.progressLine)map.removeLayer(m.progressLine);if(m.marker)map.removeLayer(m.marker)}
function drawMachine(m){removeLayers(m);if(m.route.length>1){m.routeLine=L.polyline(m.route,{color:m.color,weight:5,opacity:selected===m.id?.95:.55}).addTo(map);m.progressLine=L.polyline(progressPoints(m),{color:m.color,weight:7,opacity:.95}).addTo(map)}if(m.route.length){m.marker=L.marker(posAt(m),{icon:icon(m.color)}).addTo(map).on('click',()=>openMachine(m.id))}}
function redraw(){machines.forEach(drawMachine)}
function openSheet(html){const s=document.getElementById('sheet');s.innerHTML=html;s.classList.add('show')}
function closeSheet(){document.getElementById('sheet').classList.remove('show')}
function machineCard(m){const st=routeStats(m.route), pct=st.total?Math.min(100,m.travelled/st.total*100):0;return `<div class="card"><div class="machine"><span class="dot" style="color:${m.color};background:${m.color}"></span><div class="grow"><div class="name">${esc(m.name)}</div><div class="small">${m.running?'🟢 Движется':'⏸ Пауза'} · ${st.total.toFixed(1)} км</div></div><button class="btn" onclick="openMachine('${m.id}')">Открыть</button></div><div class="progress"><i style="width:${pct}%;--color:${m.color}"></i></div><div class="row"><button class="btn ${m.running?'green':'primary'}" onclick="toggleRun('${m.id}')">${m.running?'⏸ Пауза':'▶️ Старт'}</button><button class="btn" onclick="resetMachine('${m.id}')">🔄 Сброс</button><button class="btn red" onclick="deleteMachine('${m.id}')">🗑</button></div></div>`}
function openMachines(){selected=null;openSheet(`<div class="sheethead"><h3>🚗 Машинки</h3><button class="close" onclick="closeSheet()">×</button></div><button class="btn primary full" onclick="createAndDraw()">＋ Добавить машинку</button>${machines.length?machines.map(machineCard).join(''):'<div class="empty">Пока нет машинок.<br>Добавь первую и нарисуй маршрут.</div>'}`)}
function createAndDraw(){const m=createMachine();startDrawing(m.id);openMachine(m.id)}
function openMachine(id){selected=id;const m=machines.find(x=>x.id===id);if(!m)return;const st=routeStats(m.route),pct=st.total?Math.min(100,m.travelled/st.total*100):0;openSheet(`<div class="sheethead"><span class="dot" style="color:${m.color};background:${m.color}"></span><h3>${esc(m.name)}</h3><button class="close" onclick="closeSheet()">×</button></div><div class="grid2"><div><div class="label">Название</div><input class="input" id="mname" value="${esc(m.name)}"></div><div><div class="label">Скорость, км/ч</div><input class="input" id="mspeed" type="number" min="0" max="1000" value="${m.speed}"></div></div><div class="label">Маршрут</div><div class="small">${m.route.length} точек · ${st.total.toFixed(2)} км</div><div class="progress"><i style="width:${pct}%;--color:${m.color}"></i></div><div class="row" style="margin-top:10px"><button class="btn ${m.running?'green':'primary'}" onclick="toggleRun('${m.id}')">${m.running?'⏸ Пауза':'▶️ Старт'}</button><button class="btn" onclick="resetMachine('${m.id}')">🔄 Сброс</button><button class="btn" onclick="startDrawing('${m.id}')">✏️ Маршрут</button></div><div class="row" style="margin-top:8px"><button class="btn" onclick="saveRoute('${m.id}')">💾 Сохранить маршрут</button><button class="btn red" onclick="deleteMachine('${m.id}')">🗑 Удалить</button></div><button class="btn full" style="margin-top:8px" onclick="saveMachineSettings('${m.id}')">Сохранить настройки</button>`)}
function saveMachineSettings(id){const m=machines.find(x=>x.id===id);if(!m)return;m.name=document.getElementById('mname').value||m.name;m.speed=Math.max(0,Math.min(1000,+document.getElementById('mspeed').value||0));persistState();redraw();openMachine(id);toast('Настройки сохранены')}
function toggleRun(id){const m=machines.find(x=>x.id===id);if(!m.route.length){toast('Сначала нарисуй маршрут');startDrawing(id);return}m.running=!m.running;selected=id;refresh();}
function resetMachine(id){const m=machines.find(x=>x.id===id);m.travelled=0;m.running=false;selected=id;persistState();refresh();toast(`${m.name}: сброшена`)}
function deleteMachine(id){const m=machines.find(x=>x.id===id);if(!m)return;removeLayers(m);machines=machines.filter(x=>x.id!==id);selected=null;persistState();openMachines();toast('Машинка удалена')}
map.on('click',e=>{if(!drawing)return;const m=machines.find(x=>x.id===drawing);if(!m)return;m.route.push({lat:e.latlng.lat,lng:e.latlng.lng});m.travelled=0;persistState();drawMachine(m);});
function startDrawing(id){drawing=id;selected=id;map.getContainer().style.cursor='crosshair';toast('Нажимай на карту — добавляй точки маршрута. Завершить: Готово');openSheet(`<div class="sheethead"><h3>✏️ Рисуем маршрут</h3><button class="close" onclick="finishDrawing()">Готово</button></div><div class="small">Точки добавляются касаниями по карте. После завершения маршрут сохранится за выбранной машинкой.</div><div class="row" style="margin-top:10px"><button class="btn" onclick="undoPoint()">↩️ Удалить точку</button><button class="btn" onclick="clearRoute('${id}')">🧹 Очистить</button></div>`)}
function undoPoint(){if(!drawing)return;const m=machines.find(x=>x.id===drawing);m.route.pop();m.travelled=0;persistState();drawMachine(m)}
function clearRoute(id){const m=machines.find(x=>x.id===id);m.route=[];m.travelled=0;persistState();drawMachine(m)}
function finishDrawing(){drawing=null;map.getContainer().style.cursor='';if(selected)openMachine(selected);else closeSheet();toast('Маршрут готов')}
function saveRoute(id){const m=machines.find(x=>x.id===id);if(m.route.length<2){toast('Нужно минимум 2 точки');return}const name=prompt('Название маршрута',m.name+' — маршрут');if(!name)return;savedRoutes.push({id:Date.now(),name,route:m.route});localStorage.setItem('offcard_routes',JSON.stringify(savedRoutes));toast('Маршрут сохранён')}
function openRoutes(){openSheet(`<div class="sheethead"><h3>🛣 Маршруты</h3><button class="close" onclick="closeSheet()">×</button></div>${savedRoutes.length?savedRoutes.map(r=>`<div class="card"><div class="name">${esc(r.name)}</div><div class="small">${r.route.length} точек · ${routeStats(r.route).total.toFixed(2)} км</div><div class="row" style="margin-top:8px"><button class="btn primary" onclick="loadRoute(${r.id})">Загрузить</button><button class="btn red" onclick="deleteRoute(${r.id})">🗑</button></div></div>`).join(''):'<div class="empty">Сохранённых маршрутов пока нет.</div>'}`)}
function loadRoute(id){const r=savedRoutes.find(x=>x.id===id);let m=selected?machines.find(x=>x.id===selected):null;if(!m)m=createMachine();m.route=r.route.map(x=>({...x}));m.travelled=0;m.running=false;persistState();drawMachine(m);openMachine(m.id);map.fitBounds(L.latLngBounds(m.route));toast('Маршрут загружен')}
function deleteRoute(id){savedRoutes=savedRoutes.filter(x=>x.id!==id);localStorage.setItem('offcard_routes',JSON.stringify(savedRoutes));openRoutes()}
function saveScenario(){const name=prompt('Название сценария','Мой сценарий');if(!name)return;scenarios.push({id:Date.now(),name,machines:machines.map(m=>({name:m.name,color:m.color,speed:m.speed,route:m.route,travelled:m.travelled}))});localStorage.setItem('offcard_scenarios',JSON.stringify(scenarios));toast('Сценарий сохранён')}
function openScenarios(){openSheet(`<div class="sheethead"><h3>🎬 Сценарии</h3><button class="close" onclick="closeSheet()">×</button></div><button class="btn primary full" onclick="saveScenario()">💾 Сохранить текущий сценарий</button>${scenarios.length?scenarios.map(s=>`<div class="card"><div class="name">${esc(s.name)}</div><div class="small">${s.machines.length} машин · ${s.machines.reduce((a,m)=>a+routeStats(m.route).total,0).toFixed(1)} км</div><div class="row" style="margin-top:8px"><button class="btn primary" onclick="loadScenario(${s.id})">Загрузить</button><button class="btn red" onclick="deleteScenario(${s.id})">🗑</button></div></div>`).join(''):'<div class="empty">Сохрани текущую карту как сценарий — все машинки, цвета, скорости и маршруты восстановятся вместе.</div>'}`)}
function loadScenario(id){const s=scenarios.find(x=>x.id===id);machines.forEach(removeLayers);machines=s.machines.map((x,i)=>({...x,id:(crypto.randomUUID?crypto.randomUUID():Date.now()+i),running:false,routeLine:null,progressLine:null,marker:null}));selected=null;persistState();redraw();openMachines();fitAll();toast('Сценарий загружен')}
function deleteScenario(id){scenarios=scenarios.filter(x=>x.id!==id);localStorage.setItem('offcard_scenarios',JSON.stringify(scenarios));openScenarios()}
function fitAll(){const pts=machines.flatMap(m=>m.route);if(!pts.length)return;map.fitBounds(L.latLngBounds(pts),{padding:[30,30]})}
function home(){openSheet(`<div class="menuTitle">Off-Card</div><div class="small" style="margin-bottom:12px">Планируй. Запускай. Контролируй.</div><button class="btn primary full" onclick="createAndDraw()">▶️ Быстрый старт</button><div class="grid2" style="margin-top:8px"><button class="btn" onclick="openMachines()">🚗 Машинки</button><button class="btn" onclick="openRoutes()">🛣 Маршруты</button><button class="btn" onclick="openScenarios()">🎬 Сценарии</button><button class="btn" onclick="openStats()">📊 Статистика</button></div><div class="card"><div class="name">Сейчас</div><div class="small">${machines.length} машинок · ${machines.filter(m=>m.running).length} движутся</div></div>`)}
function openStats(){let total=machines.reduce((a,m)=>a+routeStats(m.route).total,0);openSheet(`<div class="sheethead"><h3>📊 Статистика</h3><button class="close" onclick="closeSheet()">×</button></div><div class="card"><div class="small">Машинок</div><div style="font-size:28px;font-weight:800">${machines.length}</div></div><div class="card"><div class="small">Общая длина маршрутов</div><div style="font-size:28px;font-weight:800">${total.toFixed(1)} км</div></div>${machines.map(m=>`<div class="card"><div class="name" style="color:${m.color}">${esc(m.name)}</div><div class="small">${routeStats(m.route).total.toFixed(2)} км · ${m.speed} км/ч · ${m.running?'движется':'пауза'}</div></div>`).join('')}`)}
function openSettings(){openSheet(`<div class="sheethead"><h3>⚙️ Настройки</h3><button class="close" onclick="closeSheet()">×</button></div><div class="card"><div class="name">Единицы</div><div class="small">Скорость: км/ч · расстояние: км</div></div><button class="btn full red" onclick="if(confirm('Очистить все сохранённые маршруты и сценарии?')){localStorage.clear();savedRoutes=[];scenarios=[];machines.forEach(removeLayers);machines=[];selected=null;toast('Данные очищены');openSettings()}">Очистить сохранённые данные</button>`)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function refresh(){redraw();if(document.getElementById('sheet').classList.contains('show')){if(selected)openMachine(selected);else openMachines()}}
function loop(now){const dt=Math.min(.25,(now-last)/1000);last=now;let changed=false;for(const m of machines){if(m.running&&m.route.length>1){const total=routeStats(m.route).total;m.travelled+=Math.max(0,m.speed)/3600*dt;if(m.travelled>=total){m.travelled=total;m.running=false;toast(m.name+' завершила маршрут')}changed=true}}if(changed)redraw();requestAnimationFrame(loop)}setTimeout(()=>map.invalidateSize(),250);requestAnimationFrame(loop);

document.getElementById('addMachine').onclick=createAndDraw;document.getElementById('fitAll').onclick=fitAll;document.getElementById('settingsBtn').onclick=openSettings;document.getElementById('helpBtn').onclick=()=>openSheet(`<div class="sheethead"><h3>❓ Как пользоваться</h3><button class="close" onclick="closeSheet()">×</button></div><div class="small">Добавь машинку → нарисуй маршрут точками на карте → задай скорость → Старт. Можно запускать несколько машинок одновременно. Кнопка «Сброс» перезапускает только выбранную машинку.</div>`);
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');const p=b.dataset.page;if(p==='home')home();if(p==='machines')openMachines();if(p==='routes')openRoutes();if(p==='scenarios')openScenarios();if(p==='map')closeSheet()});
restoreState();home();
}
</script></body></html>
